[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "driveautomate"
version = "3.0.0"
description = "Inventário e download seletivo de arquivos do Google Drive em uma interface desktop."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DriveAutomate contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "google-api-python-client>=2.190,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "openpyxl>=3.1,<4",
  "PySide6>=6.8,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.10,<7", "pytest>=9,<10"]

[project.scripts]
driveautomate = "main:main"

[tool.setuptools]
py-modules = [
  "main",
  "oauth_config",
  "secure_store",
  "drive_inventory",
  "drive_downloader",
  "drive_inventory_gui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
