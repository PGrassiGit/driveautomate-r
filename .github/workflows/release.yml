name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Check repository for secrets
        run: python scripts/check_no_secrets.py

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean DriveAutomate.spec

      - name: Smoke test executable
        run: .\scripts\smoke_test_exe.ps1

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 2
          $exe = Resolve-Path .\dist\DriveAutomate.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash *DriveAutomate.exe" | Set-Content -Encoding ascii .\dist\DriveAutomate.exe.sha256
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md .\dist\
          Compress-Archive -Path .\dist\DriveAutomate.exe, .\dist\DriveAutomate.exe.sha256, .\dist\LICENSE, .\dist\THIRD_PARTY_NOTICES.md -DestinationPath .\dist\DriveAutomate-windows.zip -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\DriveAutomate.exe `
            .\dist\DriveAutomate.exe.sha256 `
            .\dist\DriveAutomate-windows.zip `
            --title "DriveAutomate ${{ github.ref_name }}" `
            --generate-notes
